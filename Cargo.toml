
[package]
name        =  "Evento"
version     =  "0.0.1"
description =  "embedded programming language prototype"
authors     = ["Dmitry Ponyatov <dponyatov@gmail.com>"]
license     =  "MIT"
edition     =  "2025"

[dependencies]

[[bin]]
name  = "evento"
path  = "src/rs.rs"
test  = false
debug = true

[features]
# hw
pc            = ["i5"]
pillf103      = ["stm32f103c8t6"]
f429disco     = ["stm32f429zit6"]
# cpu
i5            = ["x86_64"]
stm32f103c8t6 = ["cortexM4"]
stm32f429zit6 = ["cortexM4"]
# arch
x86_64        = ["linux"]
cortexM       = ["bare"]
cortexM3      = ["cortexM"]
cortexM4      = ["cortexM"]
# os
linux         = []
bare          = []
